name: CI/CD Pipeline - Nginx Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar archivos estáticos
        run: |
          echo "Iniciando validación de archivos..."
          if [ ! -f index.html ]; then
            echo "Error: index.html no encontrado."
            exit 1
          fi
          echo "Verificando estructura HTML básica..."
          grep -q "<!DOCTYPE html>" index.html
          echo "CI completado: archivo válido y listo para producción."

  cd:
    name: Despliegue Continuo (CD)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Copiar archivos al servidor web (Nginx)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "index.html"
          target: "/var/www/html"
          overwrite: true

      - name: Reiniciar o verificar Nginx (Opcional)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
